name: Build and Test
permissions:
  contents: read
  pull-requests: read

on:
  push:
    branches:
      - "**"
      - "!gh-pages"
  pull_request:
    branches:
      - main

jobs:
  build-test:
    runs-on: ubuntu-latest
    container:
      image: fedora:latest

    # Build and test under each supported C compiler. The CMake coverage target
    # branches on CMAKE_C_COMPILER_ID, so forwarding the chosen compiler via CC
    # exercises the full GCC and Clang pipelines, including each toolchain's own
    # coverage tools (lcov for GCC, llvm-cov for Clang).
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    env:
      # Forward the chosen compiler to CMake via CC.
      CC: ${{ matrix.compiler }}

    name: Test compile (${{ matrix.compiler }})

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update
          dnf -y install \
            gcc \
            gcc-c++ \
            make \
            cmake \
            git \
            libxcrypt-devel \
            openssl-devel \
            libselinux-devel \
            libbsd-devel \
            pam-devel \
            asciidoctor \
            lcov
          # clang + LLVM coverage tools.
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            dnf -y install clang clang-devel llvm
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build -S . -Wdev -Wdeprecated \
            -DBUILD_TESTING=ON \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: |
          export LDFLAGS="-Wl,--as-needed -Wl,-z,relro -Wl,-z,now -Wl,-z,combreloc"
          cmake --build build --parallel --verbose

      - name: Test
        run: |
          cd build
          ctest --output-on-failure --verbose

      - name: Coverage
        run: make -C build coverage
